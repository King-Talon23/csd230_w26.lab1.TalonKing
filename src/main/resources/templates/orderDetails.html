<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Order Confirmation</title>
</head>
<body>

<h1>Order Confirmation</h1>

<p>Order ID: <span th:text="${order.id}"></span></p>
<p>Date: <span th:text="${order.orderDate}"></span></p>
<p>Total Paid: <span th:text="${order.totalAmount}"></span></p>

<h3>Items Purchased</h3>

<ul>
    <li th:each="p : ${order.products}"
        th:text="${p.productType} + '- $' + ${p.price}">
    </li>
</ul>

<a th:href="@{/books}">Back to Store</a>

</body>
</html>
